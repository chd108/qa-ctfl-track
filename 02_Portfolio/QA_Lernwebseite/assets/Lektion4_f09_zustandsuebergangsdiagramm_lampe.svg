<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 380">
  <defs>
    <style>
      .f { font-family: system-ui, sans-serif; }
      .t12 { font-size: 12px; }
      .t14 { font-size: 14px; font-weight: 500; }
      .tx-muted { fill: #3d3d3a; }
      .tx-z1 { fill: #5f5e5a; }
      .tx-z1-strong { fill: #444441; }
      .tx-z2 { fill: #854f0b; }
      .tx-z2-strong { fill: #633806; }
      .box-z1 { fill: #f1efe8; stroke: #5f5e5a; stroke-width: 0.5; }
      .box-z2 { fill: #faeeda; stroke: #854f0b; stroke-width: 0.5; }
      .arrow-line { fill: none; stroke: #888780; stroke-width: 1.5; marker-end: url(#arrow); }
      .dot-ev { fill: #ba7517; }
      .dot-ac { fill: #0f6e56; }
      .t10 { font-size: 9.5px; opacity: 0.88; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="f">
    <!-- Z1 -->
    <g>
      <rect class="box-z1" x="55" y="160" width="175" height="56" rx="8"/>
      <text class="t12 tx-z1" x="142" y="180" text-anchor="middle" dominant-baseline="central">Zustand Z1</text>
      <text class="t14 tx-z1-strong" x="142" y="200" text-anchor="middle" dominant-baseline="central">Lampe: AUS</text>
    </g>

    <!-- Z2 -->
    <g>
      <rect class="box-z2" x="450" y="160" width="175" height="56" rx="8"/>
      <text class="t12 tx-z2" x="537" y="180" text-anchor="middle" dominant-baseline="central">Zustand Z2</text>
      <text class="t14 tx-z2-strong" x="537" y="200" text-anchor="middle" dominant-baseline="central">Lampe: AN</text>
    </g>

    <!-- Pfeil Z1 → Z2 (oben); Ereignis am Start (links), Aktion am Ziel (rechts) -->
    <polyline class="arrow-line" points="142,160 142,110 537,110 537,160"/>
    <text class="f t10 tx-muted" x="339.5" y="102" text-anchor="middle">(der Wechsel = Übergang)</text>

    <g>
      <circle class="dot-ev" cx="168" cy="68" r="4"/>
      <text class="t12 tx-muted" x="177" y="72">Ereignis:</text>
      <text class="t12 tx-muted" x="177" y="88">Schalter drücken</text>
    </g>
    <g>
      <circle class="dot-ac" cx="400" cy="68" r="4"/>
      <text class="t12 tx-muted" x="409" y="72">Aktion:</text>
      <text class="t12 tx-muted" x="409" y="88">Stromkreis schließen</text>
    </g>

    <!-- Pfeil Z2 → Z1 (unten); Ereignis am Start (rechts), Aktion am Ziel (links) -->
    <polyline class="arrow-line" points="537,216 537,268 142,268 142,216"/>
    <text class="f t10 tx-muted" x="339.5" y="264" text-anchor="middle">(der Wechsel = Übergang)</text>

    <!-- unten: Aktion links (Ziel Z1), Ereignis rechts (Start Z2) -->
    <g>
      <circle class="dot-ac" cx="168" cy="298" r="4"/>
      <text class="t12 tx-muted" x="177" y="302">Aktion:</text>
      <text class="t12 tx-muted" x="177" y="318">Stromfluss unterbrechen</text>
    </g>
    <g>
      <circle class="dot-ev" cx="400" cy="298" r="4"/>
      <text class="t12 tx-muted" x="409" y="302">Ereignis:</text>
      <text class="t12 tx-muted" x="409" y="318">Schalter drücken</text>
    </g>

    <!-- Legende zentriert -->
    <g>
      <rect class="box-z1" x="182" y="350" width="12" height="12" rx="2"/>
      <text class="t12 tx-muted" x="199" y="361">Zustand</text>
    </g>
    <line class="arrow-line" x1="261" y1="356" x2="296" y2="356"/>
    <text class="t12 tx-muted" x="304" y="361">Übergang</text>
    <g>
      <circle class="dot-ev" cx="376" cy="356" r="4"/>
      <text class="t12 tx-muted" x="386" y="361">Ereignis</text>
    </g>
    <g>
      <circle class="dot-ac" cx="458" cy="356" r="4"/>
      <text class="t12 tx-muted" x="468" y="361">Aktion</text>
    </g>
  </g>
</svg>
